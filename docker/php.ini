; Conservar conexion.php: localhost se conecta al socket compartido con MariaDB.
mysqli.default_socket = /var/run/mysqld/mysqld.sock

; Equivalentes Linux de los ajustes de subida del proyecto de XAMPP.
file_uploads = On
upload_max_filesize = 100M
post_max_size = 120M
max_file_uploads = 30
max_execution_time = 600
memory_limit = 512M
upload_tmp_dir = /tmp
