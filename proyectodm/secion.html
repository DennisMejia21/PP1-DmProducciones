<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión - DM Producciones</title>
  <link rel="stylesheet" href="./Styles/secion.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <h1>DM Producciones</h1>
      <p class="tagline">Accede a tu cuenta para gestionar tu portafolio</p>
    </header>

    <section class="auth-container">
      <!-- Tarjeta: Iniciar sesión -->
      <article class="card login-card">
        <h2>Iniciar sesión</h2>

        <form id="loginForm" action="secion.php" method="post" autocomplete="on">
          <label for="login-email">Correo</label>
          <input id="login-email" name="email" type="email" placeholder="tu@ejemplo.com" required>

          <label for="login-pass">Contraseña</label>
          <input id="login-pass" name="password" type="password" placeholder="Contraseña" minlength="6" required>

          <div class="row space-between">
            <label class="checkbox">
              <input type="checkbox" name="remember" />
              Recordarme
            </label>
            <a class="small-link" href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn primary">Entrar</button>
        </form>
      </article>
    </section>

    <footer class="footer">
      <p>© 2025 DM Producciones — <a href="#">Soporte</a></p>
    </footer>
  </main>

  <script>
    // Evita envío vacío o validación extra si querés
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e) => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      if (email === "" || pass === "") {
        e.preventDefault();
        alert("Por favor completa todos los campos.");
      }
    });
  </script>
</body>
</html>
